# Curated catalog of SLMs the lab recommends for local inference.
#
# Total catalog footprint when fully installed: ~50 GB. Users only
# install what they need — the chat model gallery shows everything
# from this catalog with installed/available state, so they can see
# the breadth of options without committing disk.
#
# Format per entry:
#   id            ollama model id (model:tag) — also the install handle
#   name          display name
#   family        gpt-oss | gemma | qwen | llama | phi | mistral | deepseek
#   size_gb       approximate download size
#   released      YYYY-MM (when the weights or this tag were published)
#   source        ollama | mlx | hf
#   good_at       short list, used as chips in the UI
#   description   one-line pitch
#   install       install command (shown to user; one-click in phase 2)
#   tier          recommended | optional | flagship
#
# Ordering controls UI display order. Recommended models first.

# ── ARAIL's default — AI Engineer (qwen3:8b base + custom persona) ──
- id: ai-engineer:latest
  name: AI Engineer
  family: qwen
  size_gb: 5.2
  released: 2026-05
  source: ollama
  good_at: [chat, reasoning, agent, code]
  description: ARAIL's default local assistant — Qwen 3 8B base, AI
               Engineer Expert persona. Built from models/ai-engineer/Modelfile.
  install: "ollama create ai-engineer -f models/ai-engineer/Modelfile"
  tier: recommended

# ── OpenAI's open-weight reasoning models — gpt-oss ────────────────
- id: gpt-oss:20b
  name: GPT-OSS 20B
  family: gpt-oss
  size_gb: 13
  released: 2025-08
  source: ollama
  good_at: [reasoning, agent, chat, tool-use]
  description: OpenAI's open-weight 20B reasoning model — strong on
               agent + tool-use benchmarks, MoE under the hood.
  install: "ollama pull gpt-oss:20b"
  tier: flagship

