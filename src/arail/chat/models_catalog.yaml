# Curated catalog of SLMs the lab recommends for local inference.
#
# Total catalog footprint when fully installed: ~50 GB. Users only
# install what they need — the chat model gallery shows everything
# from this catalog with installed/available state, so they can see
# the breadth of options without committing disk.
#
# Format per entry:
#   id            ollama model id (model:tag) — also the install handle
#   name          display name
#   family        gpt-oss | gemma | qwen | llama | phi | mistral | deepseek
#   size_gb       approximate download size
#   released      YYYY-MM (when the weights or this tag were published)
#   source        ollama | mlx | hf
#   good_at       short list, used as chips in the UI
#   description   one-line pitch
#   install       install command (shown to user; one-click in phase 2)
#   tier          recommended | optional | flagship
#
# Ordering controls UI display order. Recommended models first.

# ── ARAIL's default — ai-eng (the only model that ships pre-installed) ──
# 1.5B-parameter Opus-4.7-derived AI engineering expert from QuKaiZen's
# Project Nucleus. Self-hosted on HuggingFace; setup pulls via a single
# `ollama pull hf.co/...` with no local Modelfile build step.
# (The __PLACEHOLDER__ repo/quant values below are filled in after the
# GGUF is packaged and uploaded via scripts/package_ai_eng.sh.)
- id: ai-eng:latest
  name: AI Engineer (ai-eng)
  family: qukaizen
  size_gb: 1.0
  released: 2026-05
  source: ollama
  good_at: [chat, reasoning, agent, code]
  description: ARAIL's default local assistant — a 1.5B-parameter Opus-4.7-derived
               AI engineering expert from QuKaiZen's Project Nucleus.
  install: "ollama pull hf.co/qukaizen/ai-eng-1.5b-gguf:Q4_K_M"
  tier: recommended

# ── Deep model placeholder (maximus, pull-on-demand) ─────────────────
# The 20–30B deep model for maximus tier is operator-configured.
# Set AIRLLM_MODEL or AEROLLM_MODEL in .env to your chosen model id
# and download it on demand (not a setup auto-install).
# See NOTICE and sprints/2026-05-30-model-hosting-reframe/ARCHITECTURE.md
# § Part 1 for guidance on picking a deep model.
- id: __TODO_DEEP_MODEL__
  name: Deep Model (configure yours)
  family: operator-configured
  size_gb: 0
  released: ""
  source: hf
  good_at: [deep-reasoning, long-context, research]
  description: "Maximus deep mode: set your preferred 20–30B model in .env
               (AIRLLM_MODEL or AEROLLM_MODEL). Download on demand — not a
               setup auto-install. See docs for model selection guidance."
  install: ""
  tier: flagship

