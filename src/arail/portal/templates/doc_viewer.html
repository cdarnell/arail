<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ brand.name }} — {{ doc_path }}</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .doc-shell {
    max-width: 920px;
    margin: 1.4rem auto 3rem;
    padding: 1.6rem 2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    line-height: 1.6;
  }
  .doc-path-bar {
    color: var(--muted);
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 0.6rem;
  }
  .doc-path-bar code { color: var(--blue); background: transparent; padding: 0; }
  .doc-shell h1 { color: var(--text-hi); margin-top: 0; }
  .doc-shell h2 { color: var(--green); margin-top: 1.6rem; }
  .doc-shell h3 { color: var(--text-hi); margin-top: 1.3rem; }
  .doc-shell a { color: var(--blue); }
  .doc-shell a:hover { color: var(--text-hi); text-decoration: underline; }
  .doc-shell code {
    background: var(--surface2);
    color: var(--amber);
    padding: 0.05em 0.35em;
    border-radius: 3px;
    font-size: 0.92em;
  }
  .doc-shell pre {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0.8rem 1rem;
    border-radius: 6px;
    overflow-x: auto;
  }
  .doc-shell pre code { background: transparent; color: var(--text); padding: 0; }
  .doc-shell blockquote {
    border-left: 3px solid var(--blue);
    padding: 0.4rem 1rem;
    color: var(--muted);
    margin: 1rem 0;
    background: rgba(0, 212, 255, 0.04);
  }
  .doc-shell table {
    border-collapse: collapse;
    margin: 0.8rem 0;
    width: 100%;
  }
  .doc-shell th, .doc-shell td {
    border: 1px solid var(--border);
    padding: 0.4rem 0.7rem;
    text-align: left;
  }
  .doc-shell th { background: var(--surface2); color: var(--text-hi); }
  .doc-shell hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
  .doc-shell ul, .doc-shell ol { padding-left: 1.5rem; }
  .doc-shell li { margin: 0.2rem 0; }
</style>
</head>
<body>

{% set active = nav_active|default('docs') %}{% include "_nav.html" %}

<article class="doc-shell">
  <div class="doc-path-bar">📖 {{ doc_section|default('docs') }} / <code>{{ doc_path }}</code></div>
  {{ doc_html | safe }}
</article>

<script src="/static/nav.js?v={{ asset_v }}"></script>
</body>
</html>
