<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ brand.name }} — Knowledge Canvas</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body,html{height:100%;margin:0}
    .kc-frame{width:100%;height:calc(100vh - 60px);border:0}
    .kc-placeholder{padding:2rem}
  </style>
</head>
<body>
{% set active = '' %}{% include "_nav.html" %}

{% if has_frontend %}
  <iframe class="kc-frame" src="/_integrations/knowledge-canvas/index.html"></iframe>
{% else %}
  <main class="kc-placeholder">
    <h1>Knowledge Canvas integration not installed</h1>
    <p>Unpack <em>core/knowledge-canvas</em> into the repo root to enable the embedded canvas frontend.</p>
  </main>
{% endif %}

<script src="/static/nav.js?v={{ asset_v }}"></script>
</body>
</html>
