<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ brand.name }} — Terminal</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .container { padding: 1rem; height: calc(100vh - 50px); }
  .hint { color: var(--muted); font-size: 0.8rem; padding: 0.5rem 0; }
  .hint code { background: var(--surface2); padding: 0.15rem 0.4rem; border-radius: 3px; }
</style>
</head>
<body>
<nav>
  <span class="logo">{{ brand.logo }}</span>
  <a href="/">Dashboard</a>
  <a href="/terminal" class="active">Terminal</a>
  <a href="/notebook">Notebook</a>
  <a href="/plugins">Plugins</a>
  <a href="/graph">Graph</a>
  <span class="mode-badge airgapped">⬤ Airgapped</span>
</nav>
<div class="container">
  <p class="hint">WezTerm via ttyd — full local shell. Start ttyd: <code>ttyd -W -p 7681 zsh</code></p>
  <iframe class="embed-frame" id="term-frame" src="http://localhost:7681" title="Terminal"></iframe>
  <div id="fallback" style="display:none;" class="card">
    <h2><span class="indicator"></span> Terminal Not Running</h2>
    <p>ttyd is not available on port 7681. Start it with:</p>
    <pre style="margin:1rem 0;padding:0.75rem;background:var(--surface);border-radius:var(--radius);color:var(--green)">ttyd -W -p 7681 zsh</pre>
    <p class="hint">Or run <code>./start.sh</code> to launch all services at once.</p>
  </div>
</div>
<script>
document.getElementById('term-frame').addEventListener('error', () => {
  document.getElementById('term-frame').style.display = 'none';
  document.getElementById('fallback').style.display = '';
});
setTimeout(() => {
  const f = document.getElementById('term-frame');
  try { if (!f.contentWindow.document.body.innerHTML) throw 0; } catch(e) {
    f.style.display = 'none';
    document.getElementById('fallback').style.display = '';
  }
}, 3000);
</script>
</body>
</html>
