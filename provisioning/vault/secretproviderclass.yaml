apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: vault-kv-opencode
spec:
  provider: vault
  parameters:
    vaultAddress: "https://vault.vault.svc.cluster.local:8200"
    roleName: "opencode-role"
    objects: |
      - objectName: "db-creds"
        secretPath: "kv/data/opencode/db"
        secretKey: "password"
