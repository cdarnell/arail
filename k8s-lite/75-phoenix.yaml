# Arize Phoenix - LLM Observability & Evaluation (Kubernetes, air-gapped, Linkerd-compatible)
apiVersion: v1
kind: Namespace
metadata:
  name: phoenix
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phoenix
  namespace: phoenix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phoenix
  template:
    metadata:
      labels:
        app: phoenix
      annotations:
        linkerd.io/inject: enabled
    spec:
      containers:
      - name: phoenix
        image: arizephoenix/phoenix:latest
        ports:
        - containerPort: 6006 # Phoenix UI
        - containerPort: 8080 # API
        env:
        - name: PHOENIX_TELEMETRY_ENABLED
          value: "false"
        - name: PROMETHEUS_EXPORTER_ENABLED
          value: "true"
        - name: PROMETHEUS_EXPORTER_PORT
          value: "9102"
---
apiVersion: v1
kind: Service
metadata:
  name: phoenix
  namespace: phoenix
spec:
  type: ClusterIP
  ports:
    - port: 6006
      targetPort: 6006
      name: ui
    - port: 8080
      targetPort: 8080
      name: api
    - port: 9102
      targetPort: 9102
      name: prometheus
  selector:
    app: phoenix
