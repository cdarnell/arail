<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OGLab — Terminal</title>
<style>
  :root { --bg: #0d1117; --surface: #161b22; --border: #30363d;
          --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'SF Mono', 'Fira Code', monospace; background: var(--bg); color: var(--text); }
  nav { display: flex; align-items: center; gap: 1.5rem; padding: 0.75rem 1.5rem;
        background: var(--surface); border-bottom: 1px solid var(--border); }
  nav .logo { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
  nav a { color: var(--muted); text-decoration: none; font-size: 0.85rem; }
  nav a:hover, nav a.active { color: var(--text); }
  nav .mode { margin-left: auto; font-size: 0.75rem; padding: 0.25rem 0.6rem;
              border-radius: 999px; background: #3fb950; color: #000; font-weight: 600; }
  .container { padding: 1rem; height: calc(100vh - 50px); }
  iframe { width: 100%; height: 100%; border: 1px solid var(--border);
           border-radius: 8px; background: #000; }
  .hint { color: var(--muted); font-size: 0.8rem; padding: 0.5rem 0; }
</style>
</head>
<body>
<nav>
  <span class="logo">&#x1f9ea; OGLab</span>
  <a href="/">Dashboard</a>
  <a href="/terminal" class="active">Terminal</a>
  <a href="/notebook">Notebook</a>
  <span class="mode">AIRGAPPED</span>
</nav>
<div class="container">
  <p class="hint">WezTerm via ttyd — full local shell. Start ttyd: <code>ttyd -W -p 7681 zsh</code></p>
  <iframe src="http://localhost:7681" title="Terminal"></iframe>
</div>
</body>
</html>
