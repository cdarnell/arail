<!DOCTYPE html>

<head>

<title>OGLab — Terminal</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .container { padding: 1rem; height: calc(100vh - 50px); }

</style>

<body>
<nav>
  <span class="logo">⟨OGLab⟩</span>

  <a href="/plugins">Plugins</a>

</nav>
