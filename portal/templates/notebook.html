<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OGLab — Notebook</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .container { padding: 1rem; height: calc(100vh - 50px); }
  .hint { color: var(--muted); font-size: 0.8rem; padding: 0.5rem 0; }
  .hint code { background: var(--surface2); padding: 0.15rem 0.4rem; border-radius: 3px; }
</style>
</head>
<body>
<nav>
  <span class="logo">⟨OGLab⟩</span>
  <a href="/">Dashboard</a>
  <a href="/terminal">Terminal</a>
  <a href="/notebook" class="active">Notebook</a>
  <a href="/plugins">Plugins</a>
  <span class="mode-badge airgapped">⬤ Airgapped</span>
</nav>
<div class="container">
  <p class="hint">Jupyter Lab — start with: <code>jupyter lab --no-browser --port 8888</code></p>
  <iframe class="embed-frame" id="nb-frame" src="http://localhost:8888" title="Jupyter Lab"></iframe>
  <div id="fallback" style="display:none;" class="card">
    <h2><span class="indicator"></span> Notebook Not Running</h2>
    <p>Jupyter Lab is not available on port 8888. Start it with:</p>
    <pre style="margin:1rem 0;padding:0.75rem;background:var(--surface);border-radius:var(--radius);color:var(--green)">jupyter lab --no-browser --port 8888</pre>
    <p class="hint">Or run <code>./start.sh</code> to launch all services at once.</p>
  </div>
</div>
<script>
document.getElementById('nb-frame').addEventListener('error', () => {
  document.getElementById('nb-frame').style.display = 'none';
  document.getElementById('fallback').style.display = '';
});
setTimeout(() => {
  const f = document.getElementById('nb-frame');
  try { if (!f.contentWindow.document.body.innerHTML) throw 0; } catch(e) {
    f.style.display = 'none';
    document.getElementById('fallback').style.display = '';
  }
}, 3000);
</script>
</body>
</html>
