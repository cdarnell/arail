replicaCount: 1

# --- GLOBAL NUCLEUS SETTINGS ---
# These are overridden programmatically by bootstrap-nucleus.sh
global:
  major: "nlp"          # Default academic focus
  gpuEnabled: false     # Auto-detected by bootstrap
  openrouterKey: ""     # Injected via --set secret.openrouterKey

# --- MESH & OBSERVABILITY ---
linkerd:
  enabled: true
  
# --- COMPONENT DEFAULTS ---
# Use a common block for Downward API to avoid repeating it for every app
agentEscalator:
  downwardAPI:
    enabled: true
    mountPath: /etc/podinfo

# --- SERVICES ---
# Each component only needs to toggle 'enabled' or specific overrides
components:
  zeroclaw:
    enabled: true
  opencodeGateway:
    enabled: true
  lmdeploy:
    enabled: true
    # Example: Override only if GPU is present
    resources:
      limits:
        nvidia.com/gpu: 0 # bootstrap-nucleus.sh will change this if needed
  ollama: { enabled: true }
  phoenix: { enabled: true }
  jupyterlab: { enabled: true }
  n8n: { enabled: true }
  langchain: { enabled: true }
  redpanda: { enabled: true }
  grafana: { enabled: true }
  prometheus: { enabled: true }
  loki: { enabled: true }
  tempo: { enabled: true }

# --- LOCAL REGISTRY ---
registry:
  enabled: true
  # storage.type: hostPath | pvc | emptyDir
  storage:
    type: hostPath
    hostPath: /var/lib/minimalist/registry
    pvc:
      storageClassName: "local-path"
      size: 5Gi
  # How the registry is exposed for local pushes
  access:
    # hostPort exposes registry on the node at this port (useful for single-node Linux)
    hostPortEnabled: true
    hostPort: 5000
    # nodePort fallback for environments where hostPort is unavailable
    nodePort: 30500
  # Security options
  tls:
    enabled: false
    # Secret name containing tls.crt and tls.key (kubernetes tls secret)
    secretName: registry-tls
    # When true the bootstrap will auto-generate a self-signed cert if no TLS
    # secret exists. Set to false to require user-provided certs.
    generateSelfSignedIfMissing: true
  auth:
    enabled: false
    # Secret name containing htpasswd file at key 'htpasswd'
    htpasswdSecret: registry-htpasswd
    # Default credentials to bootstrap with (NOT recommended for production)
    # These values are used by the bootstrap script when generating an initial
    # htpasswd secret. You can override them via environment variables or by
    # creating your own secrets and disabling bootstrap generation.
    defaultUser: admin
    defaultPassword: changeme
  # When true the bootstrap will auto-generate a self-signed cert if no TLS
  # secret exists. Set to false to require user-provided certs.
  tls:
    generateSelfSignedIfMissing: true
