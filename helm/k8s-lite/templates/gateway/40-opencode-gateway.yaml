# Opencode Gateway (AI Core)
apiVersion: v1
kind: Namespace
metadata:
  name: opencode
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode-gateway
  namespace: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencode-gateway
  template:
    metadata:
      labels:
        app: opencode-gateway
    spec:
      containers:
      - name: opencode-gateway
        image: gentoofoo/opencode-gateway:latest
        ports:
        - containerPort: 8000
        env:
        - name: ENV
          value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: opencode-gateway
  namespace: opencode
spec:
  selector:
    app: opencode-gateway
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
