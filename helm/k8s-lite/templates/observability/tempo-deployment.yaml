{{- if .Values.components.tempo.enabled }}
# Tempo Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
      - name: tempo
        image: grafana/tempo:latest
        ports:
        - containerPort: 3200
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
spec:
  selector:
    app: tempo
  ports:
  - protocol: TCP
    port: 3200
    targetPort: 3200
{{- end }}
