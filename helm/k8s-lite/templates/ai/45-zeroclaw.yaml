# ZeroClaw (Agent Router)
apiVersion: v1
kind: Namespace
metadata:
  name: zeroclaw
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeroclaw
  namespace: zeroclaw
spec:
spec:
        {{- include "k8s.downwardAPI.volumeMount" (dict "Values" .Values "Component" "zeroclaw") | nindent 8 }}
      {{- include "k8s.downwardAPI.volume" (dict "Values" .Values "Component" "zeroclaw") | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: zeroclaw
  namespace: zeroclaw
spec:
  selector:
    app: zeroclaw
  ports:
  - protocol: TCP
    port: 9000
    targetPort: 9000
    port: 9000
    targetPort: 9000
  {{- if .Values.zeroclaw.downwardAPI.enabled }}
---
apiVersion: v1
kind: Pod
metadata:
  name: zeroclaw-downwardapi-helper
  namespace: zeroclaw
spec:
  {{- include "k8s.downwardAPI.volume" (dict "Values" .Values "Component" "zeroclaw") | nindent 2 }}
  containers:
    - name: pause
      image: k8s.gcr.io/pause:3.6
      command: ["/pause"]
      volumeMounts:
{{- include "k8s.downwardAPI.volumeMount" (dict "Values" .Values "Component" "zeroclaw") | nindent 8 }}
{{- end }}
