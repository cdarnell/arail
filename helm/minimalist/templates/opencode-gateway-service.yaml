{{- if .Values.opencodeGateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "minimalist.fullname" . }}-opencode-gateway
  labels:
    app: {{ include "minimalist.fullname" . }}-opencode-gateway
spec:
  type: ClusterIP
  selector:
    app: {{ include "minimalist.fullname" . }}-opencode-gateway
  ports:
    - port: {{ .Values.opencodeGateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
{{- end }}
