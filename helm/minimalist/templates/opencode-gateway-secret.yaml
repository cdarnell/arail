{{- if .Values.opencodeGateway.enabled }}
{{- if or .Values.opencodeGateway.secrets.vaultToken .Values.opencodeGateway.secrets.lmStudioWebhookSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "minimalist.fullname" . }}-opencode-gateway-secrets
  labels:
    app: {{ include "minimalist.fullname" . }}-opencode-gateway
type: Opaque
data:
  {{- if .Values.opencodeGateway.secrets.vaultToken }}
  VAULT_TOKEN: {{ .Values.opencodeGateway.secrets.vaultToken | b64enc }}
  {{- end }}
  {{- if .Values.opencodeGateway.secrets.lmStudioWebhookSecret }}
  LM_STUDIO_WEBHOOK_SECRET: {{ .Values.opencodeGateway.secrets.lmStudioWebhookSecret | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
