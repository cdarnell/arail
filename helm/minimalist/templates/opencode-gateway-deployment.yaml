{{- if .Values.opencodeGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "minimalist.fullname" . }}-opencode-gateway
  labels:
    app: {{ include "minimalist.fullname" . }}-opencode-gateway
spec:
  replicas: {{ .Values.opencodeGateway.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "minimalist.fullname" . }}-opencode-gateway
  template:
    metadata:
      labels:
        app: {{ include "minimalist.fullname" . }}-opencode-gateway
        telemetry: "enabled"
    spec:
      serviceAccountName: {{ include "minimalist.serviceAccountName" . }}
      containers:
        - name: opencode-gateway
          image: "{{ .Values.opencodeGateway.image.repository }}:{{ .Values.opencodeGateway.image.tag }}"
          imagePullPolicy: {{ .Values.opencodeGateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.opencodeGateway.service.port }}
          env:
            - name: VAULT_ADDR
              value: {{ .Values.opencodeGateway.env.VAULT_ADDR | quote }}
            - name: VAULT_TOKEN
              value: {{ .Values.opencodeGateway.env.VAULT_TOKEN | quote }}
            - name: VAULT_SECRET_PATH
              value: {{ .Values.opencodeGateway.env.VAULT_SECRET_PATH | quote }}
            - name: WEBHOOK_BASE_URL
              value: {{ .Values.opencodeGateway.env.WEBHOOK_BASE_URL | quote }}
            - name: LM_STUDIO_URL
              value: {{ .Values.opencodeGateway.env.LM_STUDIO_URL | quote }}
            - name: LM_STUDIO_WEBHOOK_SECRET
              value: {{ .Values.opencodeGateway.env.LM_STUDIO_WEBHOOK_SECRET | quote }}
          resources:
            {{- toYaml .Values.opencodeGateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: runtime-data
              mountPath: /data
      volumes:
        - name: runtime-data
          emptyDir: {}
{{- end }}
