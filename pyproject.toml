[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "oglab"
version = "0.1.0"
description = "AI Lab Blueprint — goal-driven research framework, local-first."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "huggingface-hub>=0.23.0",
]

[project.optional-dependencies]
mlx = ["mlx>=0.4.0", "mlx-lm>=0.8.0"]
cuda = ["vllm>=0.5.0", "torch>=2.3.0"]
cpu = ["llama-cpp-python>=0.2.0"]
cloud = ["anthropic>=0.31.0"]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
include = ["oglab*"]
