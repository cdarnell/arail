[build-system]
# setuptools handles editable installs and extras used by ./lab setup.
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arail"
version = "0.1.0"
description = "Autoresearch AI Lab — a learn-by-doing AI research blueprint you can share with friends and family."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

# Base dependencies are the always-on lab surfaces: portal, routing,
# workflow memory, file ingestion, vector recall, and setup helpers.
# LanceDB is core (not tier-gated) because the KB and autoresearch loop
# are too central to ship without semantic recall — it's a small, embedded
# vector DB and the lab already uses a deterministic hash embedding (see
# arail/wiki_vectors._hash_embedding) so no heavyweight ML deps come along.
dependencies = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "huggingface-hub>=0.23.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "psutil>=5.9.0",
    "markdown-it-py>=3.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "lancedb>=0.13.0",
]

[project.optional-dependencies]
# ── Install tiers ─────────────────────────────────────────────────────────
# Two tiers: min (minimalist — the default everyday lab) and max
# (maximalist — the full bench). Upgrade any time with `./arail upgrade max`.
#
#   min → Dashboard + Chat + Autoresearch + Knowledge Base + Agents +
#         LanceDB vector recall + AirLLM deep layer-streaming with a 70B
#         default (Llama-3.1-70B). External provider chat (Claude / NVIDIA
#         / OpenRouter / HF) works here via plain HTTP, no extra SDK.
#   max → + Admin + Notebooks + bigger AirLLM default (Llama-3.1-405B,
#         the model AirLLM was designed to run on 8 GB VRAM) + official
#         Anthropic SDK + optional LangChain/LangGraph.
#
# (LanceDB is in the base dependencies above — both tiers get vector
# recall by default. The `vector` extra below is kept as a back-compat
# alias for older docs.)
min = [
    "airllm>=2.0",
]
max = [
    "jupyterlab>=4.0.0",
    "anthropic>=0.31.0",
    "langchain>=0.2.0",
    "langgraph>=0.2.0",
    "airllm>=2.0",
    "pip-audit>=2.7.0,<3",
]

security = ["pip-audit>=2.7.0,<3"]

# ── Hardware/runtime extras ───────────────────────────────────────────────
# scripts/setup.sh installs one accelerator extra based on detected hardware.
mlx   = ["mlx>=0.4.0", "mlx-lm>=0.8.0"]
cuda  = ["vllm>=0.5.0", "torch>=2.3.0"]
cpu   = ["llama-cpp-python>=0.2.0"]

# ── Granular extras (also included via max above) ─────────────────────────
notebook  = ["jupyterlab>=4.0.0"]
cloud     = ["anthropic>=0.31.0"]
# `vector` is a no-op alias kept so old install docs (`pip install -e .[vector]`)
# don't break — the package is now in the base dependency list.
vector    = ["lancedb>=0.13.0"]
langchain = ["langchain>=0.2.0", "langgraph>=0.2.0"]

# ── Dev / test ────────────────────────────────────────────────────────────
dev   = ["pytest>=7.4.0"]

[project.urls]
Repository = "https://github.com/cdarnell/autoresearch-lab"
Issues     = "https://github.com/cdarnell/autoresearch-lab/issues"

[tool.arail]
# Configuration-as-code for the blueprint. Package versions, install sources,
# and runtime defaults read from one source of truth instead of scattering
# through shell scripts that drift over time.
default_blueprint    = "Autoresearch"
learning_goal        = "Improve something measurable and learn while the loop runs."
memory_backend       = "lancedb"
memory_fallback      = "json"
configuration_source = "pyproject.toml"

[tool.arail.tiers]
# Declarative surface matrix. portal/app.py reads this to tier-gate the nav.
min = { description = "Minimalist — Dashboard, Chat, Autoresearch, Knowledge Base (with LanceDB vector recall), Agents, AirLLM deep streaming (70B default).", surfaces = ["dashboard", "chat", "research", "knowledge", "agents"] }
max = { description = "Maximalist — Everything in min + Admin, Docs, Notebooks, AirLLM 405B default, LangChain/LangGraph, full cloud catalog.", surfaces = ["dashboard", "chat", "research", "knowledge", "agents", "admin", "docs", "notebooks", "terminal", "tuning", "plugins"] }

[tool.arail.models]
# Default starter models selected by setup after hardware detection.
# (mlx/cuda/cpu = the small "instant" model that runs natively on the
# accelerator; airllm_* = the heavy deep model that streams layer-by-layer
# via AirLLM and powers the dashboard "Deep model" toggle.)
#
# IMPORTANT: airllm_min and airllm_max must be Llama-family repos.
# AirLLM's compatibility surface is narrow — Llama 2/3/3.1 is the
# canonical happy path. Other families (Mistral, Qwen, DeepSeek, GLM)
# work in some versions but break in others. Check AirLLM's README
# before swapping to a non-Llama default.
mlx          = "mlx-community/Qwen3-8B-4bit"
cuda         = "Qwen/Qwen3-8B"
cpu          = "Qwen/Qwen3-8B-GGUF"
airllm_min   = "meta-llama/Llama-3.1-70B"
airllm_max   = "meta-llama/Llama-3.1-405B"
# Legacy alias kept for back-compat with older setup scripts and external
# tooling that read [tool.arail.models].airllm directly. Resolves to the
# min default (70B).
airllm       = "meta-llama/Llama-3.1-70B"
# AeroLLM (Arail's own Rust runtime) is the deep-mode default on Apple
# Silicon as of 0.1.0 alpha — mlx-community/...-4bit repos are the
# canonical 4-bit MLX quants. min ships Qwen2.5-7B-4bit (~4 GB resident,
# fits 16 GB Macs); max ships Llama-3.1-70B-4bit (~35 GB, needs 48 GB+).
# CUDA hosts still default to AirLLM until aerollm's CUDA backend lands.
aerollm_min  = "mlx-community/Qwen2.5-7B-Instruct-4bit"
aerollm_max  = "mlx-community/Llama-3.1-70B-Instruct-4bit"
# Legacy alias for tooling reading [tool.arail.models].aerollm directly.
aerollm      = "mlx-community/Qwen2.5-7B-Instruct-4bit"
# Coder starter model (Sprint 2 — opencode Workbench, max-tier only).
# Downloaded with ./arail setup --with-coder. ~2 GB Q4; fits 8 GB VRAM.
# opencode's config generator writes these into opencode.json at start.
coder_mlx    = "mlx-community/Qwen2.5-Coder-3B-Instruct-4bit"
coder_cuda   = "Qwen/Qwen2.5-Coder-3B-Instruct"
coder_cpu    = "Qwen/Qwen2.5-Coder-3B-Instruct-GGUF"

[tool.arail.package-sources]
# Deep-backend install source. The blueprint ships with AirLLM only.
# AeroLLM remains declared as a dormant entry — the AeroLLMBackend
# class still lives in src/arail/router/backends.py for the eventual
# swap-back, but setup never installs it.
airllm  = "airllm>=2.0"
aerollm = "git+https://github.com/cdarnell/aerollm@main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"arail.portal" = ["templates/*.html", "templates/wiki/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "perf: performance smoke tests (may be excluded with -m 'not perf' on slow CI)",
    "e2e: end-to-end witness tests (require a real lab process)",
    "qa: paranoid QA edge-case tests (slow; may be excluded with -m 'not qa')",
]

