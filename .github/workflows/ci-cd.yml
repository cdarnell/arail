name: Minimalist AI Lab CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.0.1'

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Render Helm chart (if present)
        run: |
          if [ -d "helm/" ]; then
            helm dependency update helm/
            helm template minimalist helm/ > k8s-lite/helm-rendered.yaml
          fi

      - name: Apply Kubernetes manifests
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          kubectl apply -f k8s-lite/

      - name: Validate deployment
        run: |
          kubectl get pods -A
          kubectl get svc -A
          kubectl get deploy,statefulset -A

      - name: Notify on failure
        if: failure()
        run: echo "Deployment failed! Check logs and pod status."
