version: '3.8'
services:
  lmdeploy:
    image: lmdeploy:latest
    build: ../lmdeploy-setup
    ports:
      - "8000:8000"
      - "9000:9000"
    environment:
      - CUDA_VISIBLE_DEVICES=0
    networks:
      - ai-mesh

  opencode-gateway:
    image: opencode-gateway:latest
    build: ../opencode-gateway
    ports:
      - "8080:8080"
    depends_on:
      - lmdeploy
    networks:
      - ai-mesh

  zeroclaw:
    image: zeroclaw:latest
    ports:
      - "8500:8500"
    networks:
      - ai-mesh

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    networks:
      - ai-mesh

  redpanda:
    image: vectorized/redpanda:latest
    command:
      - redpanda start --overprovisioned --smp 1 --memory 1G --reserve-memory 0M --node-id 0 --check=false --kafka-addr PLAINTEXT://0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    networks:
      - ai-mesh

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../observability/prometheus-deployment.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - ai-mesh

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - ai-mesh

  jupyter:
    image: jupyter/base-notebook:latest
    ports:
      - "8888:8888"
    volumes:
      - ../notebooks:/home/jovyan/work
    networks:
      - ai-mesh

networks:
  ai-mesh:
    driver: bridge
